name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  # Fails fast while pyproject.toml still declares a django-crud-views floor below 1.0.0rc1 (the theme is then
  # tested against crud-views' GitHub main, which no PyPI user can install).
  release-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: 'pip install --require-hashes --only-binary :all: -r .github/requirements/ci.txt'
      - run: python scripts/check_release_floor.py

  tests:
    needs: [release-floor]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - run: 'pip install --require-hashes --only-binary :all: -r .github/requirements/ci.txt'
      - run: nox -s "tests-${{ matrix.python-version }}(django='5.2')" "tests-${{ matrix.python-version }}(django='6.0')" "tests-${{ matrix.python-version }}(django='6.1')"
      - run: nox -s "examples-${{ matrix.python-version }}(django='5.2')" "examples-${{ matrix.python-version }}(django='6.0')" "examples-${{ matrix.python-version }}(django='6.1')"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: 'pip install --require-hashes --only-binary :all: -r docs/requirements.txt'
      - run: mkdocs build --strict

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: 'pip install --require-hashes --only-binary :all: -r .github/requirements/ci.txt'
      - run: ruff format --check .
      - run: ruff check .

  publish:
    needs: [release-floor, tests, docs, lint]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: 'pip install --require-hashes --only-binary :all: -r .github/requirements/ci.txt'
      - run: python scripts/check_release_floor.py
      - run: python -m build
      - run: python scripts/check_dist.py dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
