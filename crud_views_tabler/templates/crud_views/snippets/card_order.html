{% load i18n crud_views %}
{% if view.cv_order_fields %}
<form method="get" id="cv-card-order-form" class="d-flex align-items-center gap-2 mb-3">
  <label class="form-label mb-0 text-secondary" for="cv-order-select">{% translate "Order by" %}</label>
  <select name="{{ cv_order_param }}" id="cv-order-select" class="form-select w-auto"{% if cv_order_signed %} data-cv-action="submit-on-change"{% endif %}>
    {% for choice in cv_order_choices %}
    <option value="{{ choice.name }}"{% if choice.selected %} selected{% endif %}>{{ choice.label }}</option>
    {% endfor %}
  </select>
  {% if not cv_order_signed %}
  <div class="btn-group" role="group" aria-label="{% translate 'Sort direction' %}">
    <button type="submit" name="{{ cv_order_dir_param }}" value="asc" class="btn btn-icon{% if cv_order_dir == 'asc' %} active{% endif %}"
            title="{% translate 'Ascending' %}"{% if cv_order_dir == 'asc' %} aria-pressed="true"{% endif %}>
      {% cv_icon "sort-asc" %}<span class="visually-hidden">{% translate "Ascending" %}</span>
    </button>
    <button type="submit" name="{{ cv_order_dir_param }}" value="desc" class="btn btn-icon{% if cv_order_dir == 'desc' %} active{% endif %}"
            title="{% translate 'Descending' %}"{% if cv_order_dir == 'desc' %} aria-pressed="true"{% endif %}>
      {% cv_icon "sort-desc" %}<span class="visually-hidden">{% translate "Descending" %}</span>
    </button>
  </div>
  {% endif %}
  {% for param in cv_order_preserved_params %}
  <input type="hidden" name="{{ param.name }}" value="{{ param.value }}">
  {% endfor %}
</form>
{% endif %}
