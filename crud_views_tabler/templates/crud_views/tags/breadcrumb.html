{% if items %}
<ol class="breadcrumb" aria-label="breadcrumbs">
  {% for item in items %}
  {% if forloop.last %}
  <li class="breadcrumb-item active" aria-current="page">{{ item.title }}</li>
  {% else %}
  <li class="breadcrumb-item">{% if item.url %}<a href="{{ item.url }}">{{ item.title }}</a>{% else %}{{ item.title }}{% endif %}</li>
  {% endif %}
  {% endfor %}
</ol>
{% endif %}
