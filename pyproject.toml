[project]
name = "tabler-test"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1,<6.2",
    "django-crud-views>=0.30.0",
    "django-crispy-forms>=2.4",
    "crispy-bootstrap5>=2026.9",
]

[tool.uv.sources]
django-crud-views = { path = "../django-crud-views", editable = true }

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["templates/**/*.html", "static/**/*"]

[dependency-groups]
test = ["pytest", "pytest-django", "crispy-bootstrap5==2026.9"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.crispy_tabler.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
