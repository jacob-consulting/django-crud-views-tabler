<div class="mb-3">
  <div class="form-label mb-1">Navigation</div>
  <div class="btn-group w-100" role="group" aria-label="Navigation">
    <button type="button" class="btn btn-sm" data-layout-settings='{"navbar-position":"horizontal","sidebar":"default"}'>Top</button>
    <button type="button" class="btn btn-sm" data-layout-settings='{"navbar-position":"vertical","sidebar":"default"}'>Side</button>
    <button type="button" class="btn btn-sm" data-layout-settings='{"navbar-position":"vertical","sidebar":"folded"}'>Folded</button>
  </div>
</div>
<div class="mb-3">
  <div class="form-label mb-1">Width</div>
  <div class="btn-group w-100" role="group" aria-label="Width">
    <button type="button" class="btn btn-sm" data-layout-settings='{"layout":"default"}'>Default</button>
    <button type="button" class="btn btn-sm" data-layout-settings='{"layout":"fluid"}'>Fluid</button>
    <button type="button" class="btn btn-sm" data-layout-settings='{"layout":"boxed"}'>Boxed</button>
  </div>
</div>
<div class="mb-3">
  <div class="form-label mb-1">Navbar colour</div>
  <div class="btn-group w-100" role="group" aria-label="Navbar colour">
    <button type="button" class="btn btn-sm" data-layout-settings='{"navbar-theme":"default"}'>Default</button>
    <button type="button" class="btn btn-sm" data-layout-settings='{"navbar-theme":"dark"}'>Dark</button>
  </div>
</div>
<div>
  <div class="form-label mb-1">Navbar style</div>
  <div class="btn-group w-100" role="group" aria-label="Navbar style">
    <button type="button" class="btn btn-sm" data-layout-settings='{"navbar-style":"default"}'>Default</button>
    <button type="button" class="btn btn-sm" data-layout-settings='{"navbar-style":"floating"}'>Floating</button>
  </div>
</div>
